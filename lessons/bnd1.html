<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 1 · Complete Sentences & Comma Splices</title>
<style>
:root{--ink:#17213b;--mut:#5b6580;--line:#e3e7f0;--pri:#2447b8;--pri2:#e8eefc;--ok:#18a058;--bad:#e0464e;--warn:#f2b632;--subj:#2f6fe4;--verb:#e0464e;--bg:#0f1730}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.player{max-width:1100px;width:100%;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.top{display:flex;align-items:center;gap:10px;color:#fff}.top h1{font-size:16px;margin:0;font-weight:700}.top .sp{flex:1}
.top select,.top button{font:inherit;font-size:13px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:6px 10px;cursor:pointer}
.top select option{color:#000}
.stagewrap{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;container-type:inline-size;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.scene{position:absolute;inset:0;padding:5cqw 6cqw;display:none;flex-direction:column;gap:2.2cqw;background:linear-gradient(180deg,#fff,#f6f8fd)}
.scene.on{display:flex;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.kick{font-size:1.5cqw;font-weight:800;letter-spacing:.08em;color:var(--pri);text-transform:uppercase}
.h2{font-size:3.6cqw;font-weight:800;line-height:1.2;margin:0}
.h{opacity:0;transform:translateY(1.2cqw);transition:opacity .45s ease,transform .45s ease}
.h.in{opacity:1;transform:none}
.big{font-size:3.4cqw;font-weight:700;font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.tok{padding:.1em .15em;border-radius:.3em;transition:background .4s,color .4s,box-shadow .4s}
.tok.subj{background:#dfe9ff;color:var(--subj);box-shadow:inset 0 -.2em 0 var(--subj)}
.tok.verb{background:#ffe3e5;color:var(--verb);box-shadow:inset 0 -.2em 0 var(--verb)}
.tok.dep{background:#fff1cc;color:#8a5a00;box-shadow:inset 0 -.2em 0 var(--warn)}
.tok.ing{background:#eee;color:#666;text-decoration:line-through wavy #999}
.tok.bad{background:#ffe3e5;color:var(--bad);font-weight:800}
.tok.good{background:#ddf5e7;color:var(--ok);font-weight:800}
.row{display:flex;align-items:center;gap:1.6cqw;flex-wrap:wrap}
.chk{display:flex;flex-direction:column;gap:1.1cqw;font-size:2.2cqw}
.chk div{display:flex;align-items:center;gap:1cqw}.chk i{width:2.6cqw;height:2.6cqw;border-radius:50%;border:.25cqw solid #c9d0e0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:1.6cqw;color:#fff;transition:.4s}
.chk .on i{background:var(--ok);border-color:var(--ok)}
.stamp{font-size:2.4cqw;font-weight:900;border:.35cqw solid;border-radius:1cqw;padding:.4cqw 1.2cqw;transform:rotate(-6deg);display:inline-block}
.stamp.ok{color:var(--ok);border-color:var(--ok)}.stamp.no{color:var(--bad);border-color:var(--bad)}
.card{background:#fff;border:.15cqw solid var(--line);border-radius:1.4cqw;padding:1.8cqw 2.2cqw;box-shadow:0 .6cqw 1.8cqw rgba(23,33,59,.06)}
.chips{display:flex;gap:1cqw;flex-wrap:wrap}.chip{font-size:2cqw;font-weight:700;border-radius:99px;padding:.5cqw 1.4cqw;background:var(--pri2);color:var(--pri)}
.chip.y{background:#fff1cc;color:#8a5a00}
.lbl{font-size:1.6cqw;font-weight:800;border-radius:.6cqw;padding:.3cqw .9cqw;color:#fff}
.lbl.s{background:var(--subj)}.lbl.v{background:var(--verb)}.lbl.r{background:var(--bad)}.lbl.g{background:var(--ok)}
.cars{display:flex;align-items:center;gap:0;font-size:2.8cqw;font-family:Georgia,serif;font-weight:700}
.car{background:#eef3ff;border:.25cqw solid var(--pri);border-radius:1.2cqw;padding:1.2cqw 2cqw}
.link{width:7cqw;display:grid;place-items:center;font-size:3.2cqw;font-weight:900;color:var(--bad);position:relative}
.link.broken::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:.4cqw;background:var(--bad);transform:rotate(-20deg)}
.fix{display:grid;grid-template-columns:4.4cqw 1fr;gap:1cqw;align-items:center;font-size:2.3cqw;padding:.6cqw 0}
.fix b.n{width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:1.8cqw}
.fix .s{font-family:Georgia,serif}.fix .p{color:var(--ok);font-weight:900;font-size:1.15em}
.brace{border-left:.4cqw solid var(--warn);padding-left:1.4cqw;margin-left:1cqw;font-size:2cqw;font-weight:800;color:#8a5a00}
.vline{display:inline-block;width:.45cqw;height:4.6cqw;background:var(--pri);vertical-align:middle;margin:0 .6cqw;transform:scaleY(0);transition:transform .5s}
.vline.in{transform:scaleY(1)}
.side{display:flex;gap:2cqw}.side .card{flex:1;font-size:2cqw}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1cqw;font-size:2.1cqw}
.choices div{border:.15cqw solid var(--line);border-radius:1cqw;padding:1cqw 1.4cqw;background:#fff;transition:.4s}
.choices .x{opacity:.45;text-decoration:line-through}.choices .o{border-color:var(--ok);background:#e9f8ef;font-weight:800}
.sum li{font-size:2.3cqw;margin:.8cqw 0;line-height:1.4}
.big-ic{font-size:7cqw}
.sub{position:absolute;left:4cqw;right:4cqw;bottom:2.4cqw;text-align:center;pointer-events:none}
.sub span{display:inline;background:rgba(15,23,48,.86);color:#fff;font-size:2cqw;line-height:1.55;padding:.35cqw 1cqw;border-radius:.6cqw;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub.off{display:none}.sub span:empty{display:none}
.quiz{position:absolute;inset:0;background:rgba(15,23,48,.6);display:none;align-items:center;justify-content:center;padding:3cqw;z-index:5}
.quiz.on{display:flex}
.qbox{background:#fff;border-radius:2cqw;padding:3cqw;width:min(78cqw,100%);box-shadow:0 2cqw 5cqw rgba(0,0,0,.3)}
.qbox .qk{font-size:1.6cqw;font-weight:800;color:var(--pri);letter-spacing:.06em}
.qbox h3{font-size:2.7cqw;margin:1cqw 0 2cqw}
.qbox button.o{display:block;width:100%;text-align:left;font:inherit;font-size:2.2cqw;border:.2cqw solid var(--line);border-radius:1.2cqw;background:#fff;padding:1.4cqw 1.8cqw;margin:.9cqw 0;cursor:pointer;font-family:Georgia,serif}
.qbox button.o:hover{border-color:var(--pri)}
.qbox button.o.right{border-color:var(--ok);background:#e9f8ef}.qbox button.o.wrong{border-color:var(--bad);background:#fdecee;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.6cqw)}75%{transform:translateX(.6cqw)}}
.qfb{font-size:2cqw;line-height:1.5;margin-top:1.2cqw;min-height:3cqw}
.qgo{font:inherit;font-size:2cqw;font-weight:800;background:var(--pri);color:#fff;border:0;border-radius:1cqw;padding:1.2cqw 2.4cqw;cursor:pointer;margin-top:1cqw;display:none}
.ctrl{display:flex;align-items:center;gap:8px;color:#fff}
.ctrl button{font:inherit;font-size:15px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:44px;min-height:40px}
.ctrl button.main{background:#ffd34d;color:#1b2340;border-color:#ffd34d;font-weight:800;min-width:96px}
.bar{flex:1;display:flex;gap:3px;height:10px;cursor:pointer}
.bar i{flex:1;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0;width:0;background:#ffd34d}
.bar i.q{flex:0 0 10px;background:#7aa2ff}
.time{font-size:13px;min-width:64px;text-align:right;opacity:.85}
.chap{display:flex;gap:6px;flex-wrap:wrap}
.chap button{font:inherit;font-size:12.5px;background:rgba(255,255,255,.06);color:#cfd7f2;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;cursor:pointer}
.chap button.on{background:#fff;color:var(--ink)}
.chap button.done::before{content:"✓ ";color:#7be0a3}
.end{position:absolute;inset:0;background:linear-gradient(135deg,#14275f,#2447b8);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center;z-index:6}
.end.on{display:flex}.end h2{font-size:4cqw;margin:0}.end p{font-size:2cqw;margin:0;opacity:.9}
.end button{font:inherit;font-size:2.1cqw;font-weight:800;border-radius:1.2cqw;padding:1.3cqw 2.6cqw;cursor:pointer;border:0}
.end .go{background:#ffd34d;color:#1b2340}.end .re{background:rgba(255,255,255,.15);color:#fff}
.embed .top{padding-right:52px}.note{color:#8f9bc0;font-size:12px;text-align:center}
.pass{font-family:Georgia,"Times New Roman",serif;font-size:2.05cqw;line-height:1.6}
.small{font-size:1.9cqw;line-height:1.5}
.hl{background:#fff1cc;border-radius:.3em;padding:0 .15em;transition:background .4s}
.tbl{border-collapse:collapse;font-size:1.9cqw;background:#fff}.tbl th,.tbl td{border:.15cqw solid var(--line);padding:.6cqw 1.2cqw;text-align:center}.tbl th{background:#f2f5fc}
.tbl td.hit{background:#fff1cc;font-weight:800}
.scene.tight{gap:1.1cqw;padding-top:3.4cqw}.scene.tight .card{padding:1cqw 1.8cqw}.scene.tight .h2{font-size:3.1cqw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.4cqw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const SC=[{"id":"intro","ch":{"en":"Intro","ko":"도입","zh":"导入"},"html":"\n <div class=\"kick\">Unit 1 · Boundaries</div><h2 class=\"h2\" data-l=\"title\"></h2>\n <div class=\"card h\" id=\"i1\"><div class=\"row\"><span class=\"big-ic\" style=\"font-size:5cqw\">⚡</span><b style=\"font-size:2.4cqw\" data-l=\"fast\"></b></div></div>\n <div class=\"card h\" id=\"i2\"><div class=\"row\"><span class=\"big-ic\" style=\"font-size:5cqw\">🔑</span><b style=\"font-size:2.4cqw\" data-l=\"key\"></b></div></div>","b":[{"en":"Welcome to Lesson 1. Today we start with punctuation, the fastest points you can earn on SAT Reading and Writing.","ko":"1강에 오신 걸 환영해요. 오늘은 SAT Reading and Writing에서 가장 빨리 점수를 올릴 수 있는 문장 경계부터 시작해요.","zh":"欢迎来到第1课。今天我们从标点开始，这是SAT阅读与写作中提分最快的部分。"},{"en":"Punctuation questions follow fixed rules. Once you know the rules, you can answer each one in about thirty seconds.","ko":"문장 경계 문제는 규칙이 정해져 있어요. 규칙만 알면 한 문제를 30초 정도에 풀 수 있어요.","zh":"标点题有固定规则。掌握规则后，每道题大约30秒就能做完。","a":["in:#i1"]},{"en":"And almost every punctuation question starts with one question: is this a complete sentence? Let's learn exactly what that means.","ko":"그리고 거의 모든 문장 경계 문제는 한 가지 질문에서 시작해요. 이게 완전한 문장인가? 그 뜻을 정확히 배워 봐요.","zh":"几乎所有标点题都从一个问题开始：这是完整句子吗？我们来准确理解它的意思。","a":["in:#i2"]}]},
{"id":"complete","ch":{"en":"Complete sentence","ko":"완전한 문장","zh":"完整句子"},"html":"\n <div class=\"kick\">Step 1</div><h2 class=\"h2\" data-l=\"need\"></h2>\n <div class=\"big card\"><span class=\"tok\" id=\"c-s\">The bridge</span> <span class=\"tok\" id=\"c-v\">opened</span> in 1937.</div>\n <div class=\"row\"><span class=\"lbl s h\" id=\"c-ls\" data-l=\"subj\"></span><span class=\"lbl v h\" id=\"c-lv\" data-l=\"verb\"></span><span class=\"stamp ok h\" id=\"c-ok\">✓ COMPLETE</span></div>\n <div class=\"chk\"><div id=\"k1\"><i>✓</i><span data-l=\"subj\"></span></div><div id=\"k2\"><i>✓</i><span data-l=\"verb\"></span></div><div id=\"k3\"><i>✓</i><span data-l=\"alone\"></span></div></div>","b":[{"en":"A complete sentence, also called an independent clause, needs three things.","ko":"완전한 문장, 다른 말로 독립절에는 세 가지가 꼭 있어야 해요.","zh":"完整句子，也叫独立分句，必须具备三样东西。"},{"en":"First, a subject: who or what the sentence is about. Here, the subject is 'the bridge.'","ko":"첫째, 주어. 문장이 누구 또는 무엇에 관한 것인지예요. 여기서는 'the bridge'가 주어예요.","zh":"第一，主语：句子说的是谁或什么。这里的主语是 the bridge。","a":["add:#c-s:subj","in:#c-ls","add:#k1:on"]},{"en":"Second, a verb with a tense: something that happened, happens, or will happen. Here, 'opened,' in the past tense.","ko":"둘째, 시제가 있는 동사. 일어났거나, 일어나거나, 일어날 일이에요. 여기서는 과거 시제 'opened'예요.","zh":"第二，有时态的动词：已经发生、正在发生或将要发生的事。这里是过去时的 opened。","a":["add:#c-v:verb","in:#c-lv","add:#k2:on"]},{"en":"Third, it must be able to stand alone. Read it by itself: 'The bridge opened in 1937.' It makes complete sense, so it is a complete sentence.","ko":"셋째, 혼자 설 수 있어야 해요. 따로 읽어 보세요. 'The bridge opened in 1937.' 이것만으로 뜻이 끝나니까 완전한 문장이에요.","zh":"第三，它必须能独立成句。单独读一遍：The bridge opened in 1937. 意思完整，所以是完整句子。","a":["add:#k3:on","in:#c-ok"]}]},
{"id":"notcomplete","ch":{"en":"Not complete","ko":"불완전한 문장","zh":"不完整句子"},"html":"\n <div class=\"kick\">Step 2</div><h2 class=\"h2\">❌ Not complete</h2>\n <div class=\"big card h\" id=\"n1\"><span class=\"tok\" id=\"n1d\">Although</span> the bridge opened in 1937 <span class=\"stamp no h\" id=\"n1x\">✗</span></div>\n <div class=\"chips h\" id=\"n2\"><span class=\"chip y\" data-l=\"dep\"></span><span class=\"chip\">although</span><span class=\"chip\">because</span><span class=\"chip\">when</span><span class=\"chip\">if</span><span class=\"chip\">which</span></div>\n <div class=\"big card h\" id=\"n3\">The bridge <span class=\"tok\" id=\"n3i\">opening</span> in 1937 <span class=\"stamp no h\" id=\"n3x\">✗</span></div>","b":[{"en":"Now look at this: 'Although the bridge opened in 1937.' It has a subject and a verb, but something is missing.","ko":"이번엔 이걸 보세요. 'Although the bridge opened in 1937.' 주어도 있고 동사도 있는데, 뭔가 빠졌어요.","zh":"再看这个：Although the bridge opened in 1937. 有主语也有动词，但缺了点什么。","a":["in:#n1"]},{"en":"The word 'although' makes us wait for more. Although the bridge opened... then what? It cannot stand alone, so it is not complete.","ko":"'although'가 뒷말을 기다리게 만들어요. 다리가 개통됐지만... 그래서 뭐요? 혼자 설 수 없으니까 완전한 문장이 아니에요.","zh":"although 让我们等着后面的话。虽然桥开通了……然后呢？它不能独立成句，所以不完整。","a":["add:#n1d:dep","in:#n1x"]},{"en":"Words like although, because, when, if, and which turn a sentence into a dependent clause. Watch for them.","ko":"although, because, when, if, which 같은 말이 붙으면 문장이 종속절로 바뀌어요. 이 단어들을 꼭 보세요.","zh":"although、because、when、if、which 这类词会把句子变成从句。一定要留意它们。","a":["in:#n2"]},{"en":"Here is another one: 'The bridge opening in 1937.' 'Opening' is an i-n-g form, not a verb with a tense. No tensed verb, so it is not complete either.","ko":"하나 더 볼게요. 'The bridge opening in 1937.' 'opening'은 ing 형태라서 시제 있는 동사가 아니에요. 시제 있는 동사가 없으니 이것도 불완전해요.","zh":"再看一个：The bridge opening in 1937. opening 是 ing 形式，不是有时态的动词。没有时态动词，所以也不完整。","a":["in:#n3","add:#n3i:ing","in:#n3x"]},{"q":{"en":{"q":"Which one is a complete sentence?","o":["Because the museum closed early","The museum closed early.","The museum closing early"],"e":"It has a subject (the museum), a tensed verb (closed), and it stands alone. “Because” makes A dependent, and “closing” in C has no tense."},"ko":{"q":"완전한 문장은 어느 것일까요?","o":["Because the museum closed early","The museum closed early.","The museum closing early"],"e":"주어(the museum), 시제 있는 동사(closed)가 있고 혼자 설 수 있어요. A는 because 때문에 종속절이고, C의 closing은 시제가 없어요."},"zh":{"q":"哪一个是完整句子？","o":["Because the museum closed early","The museum closed early.","The museum closing early"],"e":"有主语（the museum）和有时态的动词（closed），并且能独立成句。A 因为 because 成了从句，C 的 closing 没有时态。"},"a":1}}]},
{"id":"errors","ch":{"en":"Run-on & comma splice","ko":"Run-on과 Comma splice","zh":"Run-on 与逗号粘连"},"html":"\n <div class=\"kick\">Step 3</div><h2 class=\"h2\">Two complete sentences</h2>\n <div class=\"cars\"><div class=\"car\">The rain stopped</div><div class=\"link h\" id=\"e1\">?</div><div class=\"car\">the game continued.</div></div>\n <div class=\"row h\" id=\"e2\"><span class=\"lbl r\" data-l=\"runon\"></span><span class=\"big\" style=\"font-size:2.3cqw\">The rain stopped <span class=\"tok bad\">⎵</span> the game continued. ✗</span></div>\n <div class=\"row h\" id=\"e3\"><span class=\"lbl r\" data-l=\"splice\"></span><span class=\"big\" style=\"font-size:2.3cqw\">The rain stopped<span class=\"tok bad\">,</span> the game continued. ✗</span></div>\n <div class=\"card h\" id=\"e4\" style=\"border-color:var(--bad)\"><b style=\"font-size:2.6cqw;color:var(--bad)\" data-l=\"rule\"></b></div>","b":[{"en":"Most SAT punctuation questions put two complete sentences side by side. Our job is to join them correctly.","ko":"SAT 문장 경계 문제는 대부분 완전한 문장 두 개를 나란히 놓아요. 우리가 할 일은 둘을 올바르게 연결하는 거예요.","zh":"SAT大多数标点题会把两个完整句子并排放在一起。我们的任务是正确地连接它们。","a":["in:#e1"]},{"en":"If you put nothing between them, it is called a run-on sentence. 'The rain stopped the game continued.' That is wrong.","ko":"사이에 아무것도 안 넣으면 run-on 문장이라고 해요. 'The rain stopped the game continued.' 틀린 문장이에요.","zh":"如果中间什么都不加，就叫 run-on（连写句）。The rain stopped the game continued. 这是错的。","a":["in:#e2"]},{"en":"If you put only a comma between them, it is called a comma splice. A comma is too weak to hold two complete sentences together.","ko":"사이에 쉼표 하나만 넣으면 comma splice라고 해요. 쉼표 하나로는 완전한 문장 두 개를 붙잡을 힘이 없어요.","zh":"如果中间只有一个逗号，就叫 comma splice（逗号粘连）。一个逗号的力量不足以连接两个完整句子。","a":["in:#e3","text:#e1:,","add:#e1:broken"]},{"en":"Remember this rule: complete sentence, comma, complete sentence is always wrong on the SAT.","ko":"이 규칙을 기억하세요. 완전한 문장, 쉼표, 완전한 문장은 SAT에서 무조건 오답이에요.","zh":"记住这条规则：完整句子、逗号、完整句子，在SAT中一定是错的。","a":["in:#e4"]}]},
{"id":"fixes","ch":{"en":"5 ways to join","ko":"연결하는 5가지 방법","zh":"5种连接方法"},"html":"\n <div class=\"kick\">Step 4</div><h2 class=\"h2\">✅ 5 correct ways</h2>\n <div style=\"display:flex;gap:2cqw;align-items:flex-start\">\n <div style=\"flex:1\">\n <div class=\"fix h\" id=\"f1\"><b class=\"n\">1</b><span class=\"s\">The rain stopped<span class=\"p\">.</span> The game continued.</span></div>\n <div class=\"fix h\" id=\"f2\"><b class=\"n\">2</b><span class=\"s\">The rain stopped<span class=\"p\">;</span> the game continued.</span></div>\n <div class=\"fix h\" id=\"f3\"><b class=\"n\">3</b><span class=\"s\">The rain stopped<span class=\"p\">, and</span> the game continued.</span></div>\n <div class=\"fix h\" id=\"f4\"><b class=\"n\">4</b><span class=\"s\">The rain stopped<span class=\"p\">:</span> the game could continue.</span></div>\n <div class=\"fix h\" id=\"f5\"><b class=\"n\">5</b><span class=\"s\">The rain stopped<span class=\"p\"> —</span> the game could continue.</span></div></div>\n <div class=\"brace h\" id=\"fb\" style=\"max-width:24cqw\"><span data-l=\"same\"></span><br>1 = 2 = 3<br><br><span style=\"font-weight:600\" data-l=\"fan\"></span></div></div>","b":[{"en":"So how do we fix it? There are five correct ways.","ko":"그럼 어떻게 고칠까요? 올바른 방법은 다섯 가지예요.","zh":"那怎么改呢？正确的方法有五种。"},{"en":"One: a period. 'The rain stopped. The game continued.' Two separate sentences.","ko":"첫째, 마침표. 'The rain stopped. The game continued.' 두 문장으로 나누는 거예요.","zh":"第一，句号。The rain stopped. The game continued. 分成两个句子。","a":["in:#f1"]},{"en":"Two: a semicolon. A semicolon works like a soft period, so it needs a complete sentence on both sides.","ko":"둘째, 세미콜론. 세미콜론은 부드러운 마침표 같은 거라서 양쪽에 완전한 문장이 있어야 해요.","zh":"第二，分号。分号就像一个柔和的句号，所以两边都必须是完整句子。","a":["in:#f2"]},{"en":"Three: a comma plus a coordinating conjunction, like and, but, or so. Remember FANBOYS: for, and, nor, but, or, yet, so. The comma and the conjunction must come together.","ko":"셋째, 쉼표 더하기 and, but, so 같은 등위접속사. FANBOYS로 외우세요. for, and, nor, but, or, yet, so. 쉼표와 접속사가 꼭 같이 와야 해요.","zh":"第三，逗号加并列连词，比如 and、but、so。用 FANBOYS 来记：for, and, nor, but, or, yet, so。逗号和连词必须一起出现。","a":["in:#f3"]},{"en":"Four: a colon, when the second part explains the first. Five: a dash, which can do a similar job.","ko":"넷째, 콜론. 뒷부분이 앞부분을 설명할 때 써요. 다섯째, 대시도 비슷한 역할을 할 수 있어요.","zh":"第四，冒号，用在后半部分解释前半部分时。第五，破折号也可以起类似作用。","a":["in:#f4","in:#f5"]},{"en":"On the SAT, the period, the semicolon, and comma plus FANBOYS do the same job. Since only one answer can be right, if two of them appear in the choices, both are wrong.","ko":"SAT에서는 마침표, 세미콜론, 쉼표 더하기 FANBOYS가 같은 역할을 해요. 정답은 하나뿐이니까, 선택지에 이 중 두 개가 같이 있으면 둘 다 오답이에요.","zh":"在SAT中，句号、分号、逗号加FANBOYS作用相同。因为正确答案只有一个，如果选项中同时出现其中两个，那两个都是错的。","a":["in:#fb"]}]},
{"id":"however","ch":{"en":"The “however” trap","ko":"however 함정","zh":"however 陷阱"},"html":"\n <div class=\"kick\">Trap</div><h2 class=\"h2\">⚠️ however ≠ and</h2>\n <div class=\"big card h\" id=\"h1\">The rain stopped<span class=\"tok bad\">,</span> however, the game was canceled. <span class=\"stamp no\">✗</span></div>\n <div class=\"big card h\" id=\"h2\">The rain stopped<span class=\"tok good\">;</span> however<span class=\"tok good\">,</span> the game was canceled. <span class=\"stamp ok\">✓</span></div>\n <div class=\"chips h\" id=\"h3\"><span class=\"chip y\" data-l=\"notconj\"></span><span class=\"chip\">however</span><span class=\"chip\">therefore</span><span class=\"chip\">moreover</span><span class=\"chip\">consequently</span><span class=\"chip\">in fact</span></div>","b":[{"en":"Here is the trap students fall for most. 'However' looks like a joining word, but it is not a conjunction.","ko":"학생들이 가장 많이 걸리는 함정이에요. 'however'는 연결하는 말처럼 보이지만 접속사가 아니에요.","zh":"这是学生最常掉进的陷阱。however 看起来像连接词，但它不是连词。"},{"en":"'The rain stopped, however, the game was canceled.' Two complete sentences with only commas. That is still a comma splice.","ko":"'The rain stopped, however, the game was canceled.' 완전한 문장 두 개를 쉼표만으로 이었어요. 이것도 comma splice예요.","zh":"The rain stopped, however, the game was canceled. 两个完整句子只用逗号连接，这仍然是逗号粘连。","a":["in:#h1"]},{"en":"Put a semicolon or a period before 'however,' and a comma after it: 'The rain stopped; however, the game was canceled.'","ko":"'however' 앞에는 세미콜론이나 마침표, 뒤에는 쉼표를 찍어요. 'The rain stopped; however, the game was canceled.'","zh":"在 however 前面用分号或句号，后面用逗号：The rain stopped; however, the game was canceled.","a":["in:#h2"]},{"en":"The same rule applies to therefore, moreover, consequently, and in fact.","ko":"therefore, moreover, consequently, in fact도 똑같은 규칙이에요.","zh":"therefore、moreover、consequently、in fact 也适用同样的规则。","a":["in:#h3"]}]},
{"id":"vline","tight":1,"ch":{"en":"Vertical line test","ko":"세로줄 테스트","zh":"竖线测试"},"html":"\n <div class=\"kick\">Tool</div><h2 class=\"h2\" data-l=\"vlt\"></h2>\n <div class=\"big card\">Engineers tested the design for three years<span class=\"vline\" id=\"v0\"></span>the bridge opened in 1937.</div>\n <div class=\"side\"><div class=\"card h\" id=\"v1\"><b data-l=\"left\"></b><br>Engineers tested the design for three years → <span data-l=\"complete\"></span></div><div class=\"card h\" id=\"v2\"><b data-l=\"right2\"></b><br>the bridge opened in 1937 → <span data-l=\"complete\"></span></div></div>\n <div class=\"card h\" id=\"v3\" style=\"font-size:2.1cqw;line-height:1.6\">✓ + ✓ → <b>. &nbsp;; &nbsp;, + FANBOYS</b><br>✓ + ✗ → <b>no . or ;</b></div>","b":[{"en":"Here is a quick tool: the vertical line test. Draw a line where the punctuation goes.","ko":"빠르게 쓰는 도구를 알려 줄게요. 세로줄 테스트예요. 구두점이 들어갈 자리에 줄을 그어요.","zh":"教你一个快速工具：竖线测试。在标点的位置画一条竖线。","a":["in:#v0"]},{"en":"Then ask two questions. Is the left side a complete sentence? Is the right side a complete sentence?","ko":"그리고 두 가지를 물어요. 왼쪽이 완전한 문장인가? 오른쪽이 완전한 문장인가?","zh":"然后问两个问题：左边是完整句子吗？右边是完整句子吗？","a":["in:#v1","in:#v2"]},{"en":"If both sides are complete, use a period, a semicolon, or a comma plus FANBOYS. If one side is not complete, a period or a semicolon is wrong.","ko":"양쪽 다 완전하면 마침표, 세미콜론, 쉼표 더하기 FANBOYS를 써요. 한쪽이라도 불완전하면 마침표나 세미콜론은 오답이에요.","zh":"如果两边都完整，就用句号、分号或逗号加FANBOYS。只要有一边不完整，句号和分号就是错的。","a":["in:#v3"]}]},
{"id":"example","ch":{"en":"Solve together","ko":"같이 풀기","zh":"一起做题"},"html":"\n <div class=\"kick\">SAT-style example</div>\n <div class=\"big card\" style=\"font-size:2.5cqw\">Engineers spent three years testing the new <b>______</b> bridge finally opened to traffic in 1937.</div>\n <div class=\"choices\"><div id=\"x1\">A) design, the</div><div id=\"x2\">B) design the</div><div id=\"x3\">C) design; the</div><div id=\"x4\">D) design and, the</div></div>\n <div class=\"side\"><div class=\"card h\" id=\"xl\"><b data-l=\"left\"></b> → <span data-l=\"complete\"></span></div><div class=\"card h\" id=\"xr\"><b data-l=\"right2\"></b> → <span data-l=\"complete\"></span></div></div>","b":[{"en":"Let's solve one together. Read the sentence and the choices.","ko":"같이 한 문제 풀어 봐요. 문장과 선택지를 읽어 보세요.","zh":"我们一起做一道题。先读句子和选项。"},{"en":"Draw the line at the blank. Left side: 'Engineers spent three years testing the new design.' Subject, tensed verb, stands alone. Complete.","ko":"빈칸에 줄을 그어요. 왼쪽: 'Engineers spent three years testing the new design.' 주어, 시제 있는 동사, 혼자 설 수 있음. 완전해요.","zh":"在空格处画线。左边：Engineers spent three years testing the new design. 有主语、有时态动词、能独立成句。完整。","a":["in:#xl"]},{"en":"Right side: 'the bridge finally opened to traffic in 1937.' Also complete.","ko":"오른쪽: 'the bridge finally opened to traffic in 1937.' 이것도 완전해요.","zh":"右边：the bridge finally opened to traffic in 1937. 也完整。","a":["in:#xr"]},{"en":"Complete plus complete. A is a comma splice. B is a run-on. D puts the comma after 'and' instead of before it. So the answer is C, the semicolon.","ko":"완전 더하기 완전이에요. A는 comma splice, B는 run-on, D는 쉼표가 and 앞이 아니라 뒤에 있어요. 그래서 정답은 세미콜론인 C예요.","zh":"完整加完整。A 是逗号粘连，B 是连写句，D 把逗号放在 and 后面而不是前面。所以答案是分号 C。","a":["add:#x1:x","add:#x2:x","add:#x4:x","add:#x3:o"]},{"q":{"en":{"q":"“The team tested the battery ___ it lasted twelve hours.” Which is correct?","o":["battery, it lasted","battery; it lasted","battery it lasted"],"e":"Both sides are complete sentences, so a semicolon works. A is a comma splice and C is a run-on."},"ko":{"q":"“The team tested the battery ___ it lasted twelve hours.” 올바른 것은?","o":["battery, it lasted","battery; it lasted","battery it lasted"],"e":"양쪽 다 완전한 문장이라 세미콜론이 맞아요. A는 comma splice, C는 run-on이에요."},"zh":{"q":"“The team tested the battery ___ it lasted twelve hours.” 哪个正确？","o":["battery, it lasted","battery; it lasted","battery it lasted"],"e":"两边都是完整句子，所以用分号。A 是逗号粘连，C 是连写句。"},"a":1}},{"q":{"en":{"q":"Which sentence is punctuated correctly?","o":["The data were clear, therefore, the study ended.","The data were clear; therefore, the study ended.","The data were clear therefore the study ended."],"e":"“Therefore” is not a conjunction. Between two complete sentences it needs a semicolon (or period) before it and a comma after it."},"ko":{"q":"구두점이 올바른 문장은?","o":["The data were clear, therefore, the study ended.","The data were clear; therefore, the study ended.","The data were clear therefore the study ended."],"e":"therefore는 접속사가 아니에요. 완전한 문장 두 개 사이에서는 앞에 세미콜론(또는 마침표), 뒤에 쉼표가 필요해요."},"zh":{"q":"哪个句子的标点是正确的？","o":["The data were clear, therefore, the study ended.","The data were clear; therefore, the study ended.","The data were clear therefore the study ended."],"e":"therefore 不是连词。在两个完整句子之间，前面要用分号（或句号），后面用逗号。"},"a":1}}]},
{"id":"summary","ch":{"en":"Summary","ko":"정리","zh":"总结"},"html":"\n <div class=\"kick\" data-l=\"sum\"></div><h2 class=\"h2\">📌 Lesson 1</h2>\n <ul class=\"sum card\"><li class=\"h\" id=\"s1\">Complete sentence = <b style=\"color:var(--subj)\">subject</b> + <b style=\"color:var(--verb)\">tensed verb</b> + stands alone</li>\n <li class=\"h\" id=\"s2\">complete , complete = <b style=\"color:var(--bad)\">comma splice ✗</b> → use <b>. &nbsp;; &nbsp;, + FANBOYS</b></li>\n <li class=\"h\" id=\"s3\"><b>however / therefore</b> → <b>; however,</b></li>\n <li class=\"h\" id=\"s4\"><span data-l=\"vlt\"></span>: left ✓? right ✓?</li></ul>","b":[{"en":"Let's review. A complete sentence has a subject and a verb with a tense, and it can stand alone.","ko":"정리해 볼게요. 완전한 문장은 주어와 시제 있는 동사가 있고, 혼자 설 수 있어요.","zh":"我们来总结。完整句子有主语和有时态的动词，并且能独立成句。","a":["in:#s1"]},{"en":"Two complete sentences need a period, a semicolon, or a comma plus FANBOYS. A comma alone is a comma splice.","ko":"완전한 문장 두 개는 마침표, 세미콜론, 쉼표 더하기 FANBOYS로 이어요. 쉼표만 있으면 comma splice예요.","zh":"两个完整句子要用句号、分号或逗号加FANBOYS连接。只有逗号就是逗号粘连。","a":["in:#s2"]},{"en":"However and therefore are not conjunctions, so put a semicolon before them.","ko":"however와 therefore는 접속사가 아니니까 앞에 세미콜론을 찍어요.","zh":"however 和 therefore 不是连词，所以前面要用分号。","a":["in:#s3"]},{"en":"And when in doubt, use the vertical line test. Next, practice with test-style questions. See you in Lesson 2!","ko":"헷갈리면 세로줄 테스트를 쓰세요. 이제 실전형 문제로 연습해요. 2강에서 만나요!","zh":"拿不准时就用竖线测试。接下来用实战题型练习吧。第2课见！","a":["in:#s4"]}]}];

/* ===== Player engine ===== */
const $=s=>document.querySelector(s);
let LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q;const s=JSON.parse(localStorage.getItem('rwlab_v1')||'{}');return s.lang||'en'}catch(e){return 'en'}})();
if(!UI[LANG])LANG='en';
const FLAT=[];SC.forEach((s,si)=>s.b.forEach((b,bi)=>FLAT.push({si,bi,b})));
let pos=0,playing=false,timer=null,speed=1,cc=true,done=new Set(),utter=null,token=0;
function t(k){return (UI[LANG]||UI.en)[k]||UI.en[k]||k}
function buildScenes(){$('#scenes').innerHTML=SC.map((s,i)=>`<section class="scene${s.tight?' tight':''}" id="sc${i}">${s.html}</section>`).join('');document.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l))}
function applyStatic(){document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;$('#ttl').textContent=t('title');document.title=t('title');$('#note').textContent=t('note');$('#lang').value=LANG;
  $('#endh').textContent=t('endh');$('#endp').textContent=t('endp');$('#endgo').textContent=META.k==='GEN'?t('go0'):t('go');$('#endre').textContent=t('re');
  document.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l));chapters();bar();setPlay()}
function chapters(){$('#chap').innerHTML=SC.map((s,i)=>`<button data-c="${i}" class="${FLAT[pos]&&FLAT[pos].si===i?'on':''} ${done.has(i)?'done':''}">${i+1}. ${s.ch[LANG]||s.ch.en}</button>`).join('')}
function bar(){const segs=SC.map((s,i)=>{const idx=FLAT.map((f,k)=>f.si===i?k:-1).filter(k=>k>=0);const a=idx[0],z=idx[idx.length-1];const p=pos<a?0:pos>z?100:Math.round((pos-a+ (playing?0.5:0))/(z-a+1)*100);return`<i data-c="${i}"><b style="width:${p}%"></b></i>`});$('#bar').innerHTML=segs.join('');
  const tot=FLAT.length;$('#time').textContent=`${Math.min(pos+1,tot)} / ${tot}`}
function setPlay(){$('#play').textContent=playing?t('pause'):t('play')}
function resetScene(si){const el=$('#sc'+si);el.innerHTML=SC[si].html;el.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l))}
function act(a){const[k,sel,v]=a.split(':');const el=document.querySelector(sel);if(!el)return;if(k==='in')el.classList.add('in');if(k==='add')el.classList.add(v);if(k==='text')el.textContent=v}
function show(p,replay){const f=FLAT[p];if(!f)return;document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('on',i===f.si));
  if(replay){resetScene(f.si);FLAT.forEach((g,k)=>{if(g.si===f.si&&k<p&&g.b.a)g.b.a.forEach(act)})}
  if(f.b.a)f.b.a.forEach(act);chapters();bar()}
function txt(b){return b[LANG]||b.en}
function stopSpeech(){token++;clearTimeout(timer);stopAud();try{speechSynthesis.cancel()}catch(e){}}
let MAN=null,AUD=null;const LID=META.id;
function loadMan(){MAN=null;fetch(`../audio/${LID}.${LANG}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(m=>{if(m&&m.lang===LANG)MAN=m}).catch(()=>{})}
function stopAud(){if(AUD){AUD.onended=null;AUD.pause();AUD=null}}
function speak(text,cb,idx){const my=++token;let fired=false;const fin=()=>{if(fired||my!==token)return;fired=true;cb()};
  const rec=MAN&&idx!=null&&MAN.beats[idx];
  if(rec){stopAud();AUD=new Audio('../audio/'+rec.file);AUD.playbackRate=speed;AUD.onended=fin;AUD.onerror=()=>{AUD=null;timer=setTimeout(fin,Math.max(2200,text.length/14*1000))};AUD.play().catch(()=>{timer=setTimeout(fin,(rec.dur||3)*1000/speed)});timer=setTimeout(fin,((rec.dur||3)/speed+4)*1000);return}
  const cps={en:14,ko:7,zh:5}[LANG]*speed;const est=Math.max(2200,text.length/cps*1000)+500;
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(text);const lc={en:'en-US',ko:'ko-KR',zh:'zh-CN'}[LANG];u.lang=lc;u.rate=speed*(LANG==='en'?0.98:1);
    const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang&&x.lang.replace('_','-').toLowerCase()===lc.toLowerCase())||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lc.slice(0,2)));
    if(v){u.voice=v;u.onend=fin;u.onerror=()=>{timer=setTimeout(fin,est)};speechSynthesis.speak(u);timer=setTimeout(fin,est*2.2);return}}}catch(e){}
  timer=setTimeout(fin,est)}
function step(){const f=FLAT[pos];if(!f){finish();return}
  if(f.b.q){showQuiz(f.b.q);return}
  $('#subt').textContent=txt(f.b);speak(txt(f.b),()=>{if(!playing)return;pos++;if(FLAT[pos]&&FLAT[pos].si!==f.si)done.add(f.si);if(pos>=FLAT.length){done.add(f.si);finish();return}show(pos);step()},pos)}
function play(){if(pos>=FLAT.length){pos=0;show(0,true)}playing=true;setPlay();$('#end').classList.remove('on');show(pos);step()}
function pause(){playing=false;stopSpeech();setPlay();bar()}
function jump(p){stopSpeech();$('#quiz').classList.remove('on');pos=Math.max(0,Math.min(FLAT.length-1,p));show(pos,true);if(playing)step();else{$('#subt').textContent=FLAT[pos].b.q?'':txt(FLAT[pos].b)}}
function sceneStart(i){return FLAT.findIndex(f=>f.si===i)}
function showQuiz(q){stopSpeech();const d=q[LANG]||q.en;$('#qk').textContent=t('check');$('#qq').textContent=d.q;$('#qfb').textContent='';$('#qgo').style.display='none';$('#qgo').textContent=t('cont');
  $('#qo').innerHTML=d.o.map((o,i)=>`<button class="o" data-i="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('');$('#quiz').classList.add('on');$('#subt').textContent='';
  const say=d.q;speak(say,()=>{},pos);
  $('#qo').onclick=e=>{const b=e.target.closest('button.o');if(!b)return;const i=+b.dataset.i;if(i===q.a){b.classList.add('right');$('#qfb').innerHTML=`<b style="color:var(--ok)">${t('right')}</b> ${d.e}`;$('#qgo').style.display='inline-block';$('#qo').onclick=null;speak(t('right'),()=>{})}else{b.classList.add('wrong');$('#qfb').innerHTML=`<b style="color:var(--bad)">${t('wrong')}</b>`;setTimeout(()=>b.classList.remove('wrong'),400)}}}
$('#qgo').onclick=()=>{$('#quiz').classList.remove('on');pos++;if(pos>=FLAT.length){finish();return}show(pos);if(playing)step();else play()};
function finish(){playing=false;stopSpeech();setPlay();SC.forEach((s,i)=>done.add(i));chapters();bar();$('#end').classList.add('on');$('#subt').textContent='';try{parent.postMessage({type:'lessonDone',id:META.id},'*')}catch(e){}}
$('#endgo').onclick=()=>{try{if(parent!==window){parent.postMessage({type:'lessonPractice',k:META.k},'*');return}}catch(e){}location.href='../index.html#train'};
$('#endre').onclick=()=>{done.clear();pos=0;$('#end').classList.remove('on');show(0,true);play()};
$('#play').onclick=()=>playing?pause():play();
$('#next').onclick=()=>{const si=FLAT[pos].si;const n=sceneStart(si+1);if(n>=0)jump(n)};
$('#prev').onclick=()=>{const si=FLAT[pos].si,st=sceneStart(si);jump(pos>st?st:sceneStart(Math.max(0,si-1)))};
$('#chap').onclick=e=>{const b=e.target.closest('button');if(b)jump(sceneStart(+b.dataset.c))};
$('#bar').onclick=e=>{const i=e.target.closest('i');if(i)jump(sceneStart(+i.dataset.c))};
$('#lang').onchange=e=>{LANG=e.target.value;try{const s=JSON.parse(localStorage.getItem('rwlab_v1')||'{}');s.lang=LANG;localStorage.setItem('rwlab_v1',JSON.stringify(s))}catch(x){}const was=playing;stopSpeech();loadMan();buildScenes();applyStatic();show(pos,true);if(was)step();else $('#subt').textContent=FLAT[pos].b.q?'':txt(FLAT[pos].b)};
$('#spd').onchange=e=>{speed=+e.target.value;if(AUD)AUD.playbackRate=speed;if(playing){stopSpeech();step()}};
$('#cc').onclick=()=>{cc=!cc;$('#sub').classList.toggle('off',!cc);$('#cc').setAttribute('aria-pressed',cc)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
if(parent!==window)document.body.classList.add('embed');loadMan();buildScenes();applyStatic();show(0);$('#subt').textContent=txt(FLAT[0].b);
</script>
