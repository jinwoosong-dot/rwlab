<!DOCTYPE html>

<head>

<title>Lesson 2 · Semicolons, Colons & Dashes</title>
<style>
:root{--ink:#17213b;--mut:#5b6580;--line:#e3e7f0;--pri:#2447b8;--pri2:#e8eefc;--ok:#18a058;--bad:#e0464e;--warn:#f2b632;--subj:#2f6fe4;--verb:#e0464e;--bg:#0f1730}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.player{max-width:1100px;width:100%;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.top{display:flex;align-items:center;gap:10px;color:#fff}.top h1{font-size:16px;margin:0;font-weight:700}.top .sp{flex:1}
.top select,.top button{font:inherit;font-size:13px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:6px 10px;cursor:pointer}
.top select option{color:#000}
.stagewrap{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;container-type:inline-size;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.scene{position:absolute;inset:0;padding:5cqw 6cqw;display:none;flex-direction:column;gap:2.2cqw;background:linear-gradient(180deg,#fff,#f6f8fd)}
.scene.on{display:flex;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.kick{font-size:1.5cqw;font-weight:800;letter-spacing:.08em;color:var(--pri);text-transform:uppercase}
.h2{font-size:3.6cqw;font-weight:800;line-height:1.2;margin:0}
.h{opacity:0;transform:translateY(1.2cqw);transition:opacity .45s ease,transform .45s ease}
.h.in{opacity:1;transform:none}
.big{font-size:3.4cqw;font-weight:700;font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.tok{padding:.1em .15em;border-radius:.3em;transition:background .4s,color .4s,box-shadow .4s}
.tok.subj{background:#dfe9ff;color:var(--subj);box-shadow:inset 0 -.2em 0 var(--subj)}
.tok.verb{background:#ffe3e5;color:var(--verb);box-shadow:inset 0 -.2em 0 var(--verb)}
.tok.dep{background:#fff1cc;color:#8a5a00;box-shadow:inset 0 -.2em 0 var(--warn)}
.tok.ing{background:#eee;color:#666;text-decoration:line-through wavy #999}
.tok.bad{background:#ffe3e5;color:var(--bad);font-weight:800}
.tok.good{background:#ddf5e7;color:var(--ok);font-weight:800}
.row{display:flex;align-items:center;gap:1.6cqw;flex-wrap:wrap}
.chk{display:flex;flex-direction:column;gap:1.1cqw;font-size:2.2cqw}
.chk div{display:flex;align-items:center;gap:1cqw}.chk i{width:2.6cqw;height:2.6cqw;border-radius:50%;border:.25cqw solid #c9d0e0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:1.6cqw;color:#fff;transition:.4s}
.chk .on i{background:var(--ok);border-color:var(--ok)}
.stamp{font-size:2.4cqw;font-weight:900;border:.35cqw solid;border-radius:1cqw;padding:.4cqw 1.2cqw;transform:rotate(-6deg);display:inline-block}
.stamp.ok{color:var(--ok);border-color:var(--ok)}.stamp.no{color:var(--bad);border-color:var(--bad)}
.card{background:#fff;border:.15cqw solid var(--line);border-radius:1.4cqw;padding:1.8cqw 2.2cqw;box-shadow:0 .6cqw 1.8cqw rgba(23,33,59,.06)}
.chips{display:flex;gap:1cqw;flex-wrap:wrap}.chip{font-size:2cqw;font-weight:700;border-radius:99px;padding:.5cqw 1.4cqw;background:var(--pri2);color:var(--pri)}
.chip.y{background:#fff1cc;color:#8a5a00}
.lbl{font-size:1.6cqw;font-weight:800;border-radius:.6cqw;padding:.3cqw .9cqw;color:#fff}
.lbl.s{background:var(--subj)}.lbl.v{background:var(--verb)}.lbl.r{background:var(--bad)}.lbl.g{background:var(--ok)}
.cars{display:flex;align-items:center;gap:0;font-size:2.8cqw;font-family:Georgia,serif;font-weight:700}
.car{background:#eef3ff;border:.25cqw solid var(--pri);border-radius:1.2cqw;padding:1.2cqw 2cqw}
.link{width:7cqw;display:grid;place-items:center;font-size:3.2cqw;font-weight:900;color:var(--bad);position:relative}
.link.broken::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:.4cqw;background:var(--bad);transform:rotate(-20deg)}
.fix{display:grid;grid-template-columns:4.4cqw 1fr;gap:1cqw;align-items:center;font-size:2.3cqw;padding:.6cqw 0}
.fix b.n{width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:1.8cqw}
.fix .s{font-family:Georgia,serif}.fix .p{color:var(--ok);font-weight:900;font-size:1.15em}
.brace{border-left:.4cqw solid var(--warn);padding-left:1.4cqw;margin-left:1cqw;font-size:2cqw;font-weight:800;color:#8a5a00}
.vline{display:inline-block;width:.45cqw;height:4.6cqw;background:var(--pri);vertical-align:middle;margin:0 .6cqw;transform:scaleY(0);transition:transform .5s}
.vline.in{transform:scaleY(1)}
.side{display:flex;gap:2cqw}.side .card{flex:1;font-size:2cqw}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1cqw;font-size:2.1cqw}
.choices div{border:.15cqw solid var(--line);border-radius:1cqw;padding:1cqw 1.4cqw;background:#fff;transition:.4s}
.choices .x{opacity:.45;text-decoration:line-through}.choices .o{border-color:var(--ok);background:#e9f8ef;font-weight:800}
.sum li{font-size:2.3cqw;margin:.8cqw 0;line-height:1.4}
.big-ic{font-size:7cqw}
.sub{position:absolute;left:4cqw;right:4cqw;bottom:2.4cqw;text-align:center;pointer-events:none}
.sub span{display:inline;background:rgba(15,23,48,.86);color:#fff;font-size:2cqw;line-height:1.55;padding:.35cqw 1cqw;border-radius:.6cqw;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub.off{display:none}.sub span:empty{display:none}
.quiz{position:absolute;inset:0;background:rgba(15,23,48,.6);display:none;align-items:center;justify-content:center;padding:3cqw;z-index:5}
.quiz.on{display:flex}
.qbox{background:#fff;border-radius:2cqw;padding:3cqw;width:min(78cqw,100%);box-shadow:0 2cqw 5cqw rgba(0,0,0,.3)}
.qbox .qk{font-size:1.6cqw;font-weight:800;color:var(--pri);letter-spacing:.06em}
.qbox h3{font-size:2.7cqw;margin:1cqw 0 2cqw}
.qbox button.o{display:block;width:100%;text-align:left;font:inherit;font-size:2.2cqw;border:.2cqw solid var(--line);border-radius:1.2cqw;background:#fff;padding:1.4cqw 1.8cqw;margin:.9cqw 0;cursor:pointer;font-family:Georgia,serif}
.qbox button.o:hover{border-color:var(--pri)}
.qbox button.o.right{border-color:var(--ok);background:#e9f8ef}.qbox button.o.wrong{border-color:var(--bad);background:#fdecee;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.6cqw)}75%{transform:translateX(.6cqw)}}
.qfb{font-size:2cqw;line-height:1.5;margin-top:1.2cqw;min-height:3cqw}
.qgo{font:inherit;font-size:2cqw;font-weight:800;background:var(--pri);color:#fff;border:0;border-radius:1cqw;padding:1.2cqw 2.4cqw;cursor:pointer;margin-top:1cqw;display:none}
.ctrl{display:flex;align-items:center;gap:8px;color:#fff}
.ctrl button{font:inherit;font-size:15px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:44px;min-height:40px}
.ctrl button.main{background:#ffd34d;color:#1b2340;border-color:#ffd34d;font-weight:800;min-width:96px}
.bar{flex:1;display:flex;gap:3px;height:10px;cursor:pointer}
.bar i{flex:1;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0;width:0;background:#ffd34d}
.bar i.q{flex:0 0 10px;background:#7aa2ff}
.time{font-size:13px;min-width:64px;text-align:right;opacity:.85}
.chap{display:flex;gap:6px;flex-wrap:wrap}
.chap button{font:inherit;font-size:12.5px;background:rgba(255,255,255,.06);color:#cfd7f2;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;cursor:pointer}
.chap button.on{background:#fff;color:var(--ink)}
.chap button.done::before{content:"✓ ";color:#7be0a3}
.end{position:absolute;inset:0;background:linear-gradient(135deg,#14275f,#2447b8);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center;z-index:6}
.end.on{display:flex}.end h2{font-size:4cqw;margin:0}.end p{font-size:2cqw;margin:0;opacity:.9}
.end button{font:inherit;font-size:2.1cqw;font-weight:800;border-radius:1.2cqw;padding:1.3cqw 2.6cqw;cursor:pointer;border:0}
.end .go{background:#ffd34d;color:#1b2340}.end .re{background:rgba(255,255,255,.15);color:#fff}
.embed .top{padding-right:52px}.note{color:#8f9bc0;font-size:12px;text-align:center}
.pass{font-family:Georgia,"Times New Roman",serif;font-size:2.05cqw;line-height:1.6}
.small{font-size:1.9cqw;line-height:1.5}
.hl{background:#fff1cc;border-radius:.3em;padding:0 .15em;transition:background .4s}
.tbl{border-collapse:collapse;font-size:1.9cqw;background:#fff}.tbl th,.tbl td{border:.15cqw solid var(--line);padding:.6cqw 1.2cqw;text-align:center}.tbl th{background:#f2f5fc}
.tbl td.hit{background:#fff1cc;font-weight:800}
.scene.tight{gap:1.1cqw;padding-top:3.4cqw}.scene.tight .card{padding:1cqw 1.8cqw}.scene.tight .h2{font-size:3.1cqw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.4cqw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===== Scenes: each beat = narration (3 languages) + visual actions ===== */
const SC=[{"id":"intro","ch":{"en":"Intro","ko":"도입","zh":"导入"},"html":"\n <div class=\"kick\">Unit 1 · Boundaries</div><h2 class=\"h2\" data-l=\"title\"></h2>\n <div class=\"row\"><div class=\"card h\" id=\"i1\" style=\"flex:1;text-align:center\"><div class=\"big-ic\" style=\"font-size:6cqw\">;</div><b style=\"font-size:2.2cqw\" data-l=\"semi\"></b></div>\n <div class=\"card h\" id=\"i2\" style=\"flex:1;text-align:center\"><div class=\"big-ic\" style=\"font-size:6cqw\">:</div><b style=\"font-size:2.2cqw\" data-l=\"colon\"></b></div>\n <div class=\"card h\" id=\"i3\" style=\"flex:1;text-align:center\"><div class=\"big-ic\" style=\"font-size:6cqw\">—</div><b style=\"font-size:2.2cqw\" data-l=\"dash\"></b></div></div>","b":[{"en":"Welcome to Lesson 2. In Lesson 1, we learned that two complete sentences need strong punctuation between them.","ko":"2강에 오신 걸 환영해요. 1강에서 완전한 문장 두 개 사이에는 강한 구두점이 필요하다고 배웠죠.","zh":"欢迎来到第2课。第1课我们学到，两个完整句子之间需要有力的标点。"},{"en":"Today we look closely at three marks that students mix up all the time: the semicolon, the colon, and the dash.","ko":"오늘은 학생들이 늘 헷갈리는 세 가지 부호를 자세히 볼게요. 세미콜론, 콜론, 그리고 대시예요.","zh":"今天我们仔细看三个学生总是混淆的符号：分号、冒号和破折号。","a":["in:#i1","in:#i2","in:#i3"]},{"en":"Each one has a simple rule. If you know the rule, you can check any answer choice in seconds.","ko":"각각 규칙은 간단해요. 규칙만 알면 어떤 선택지든 몇 초 만에 확인할 수 있어요.","zh":"每个符号的规则都很简单。掌握规则，任何选项几秒钟就能判断。"}]},
{"id":"semi","ch":{"en":"Semicolon","ko":"세미콜론","zh":"分号"},"html":"\n <div class=\"kick\">Step 1</div><h2 class=\"h2\" data-l=\"semi\"></h2>\n <div class=\"big card\">The library closed at noon<span class=\"tok\" id=\"s-p\">;</span> the staff went home early.</div>\n <div class=\"side\"><div class=\"card h\" id=\"s-l\"><b data-l=\"left\"></b><br>The library closed at noon → ✓</div><div class=\"card h\" id=\"s-r\"><b data-l=\"right2\"></b><br>the staff went home early → ✓</div></div>\n <div class=\"card h\" id=\"s-t\" style=\"font-size:2.1cqw\"><b data-l=\"test\"></b><div class=\"pass\">The library closed at noon<b style=\"color:var(--ok)\">.</b> The staff went home early. ✓</div></div>","b":[{"en":"Let's start with the semicolon. Think of it as a soft period.","ko":"세미콜론부터 볼게요. 부드러운 마침표라고 생각하세요.","zh":"先看分号。把它想成一个柔和的句号。","a":["add:#s-p:good"]},{"en":"That means the rule is the same as a period: there must be a complete sentence on the left and a complete sentence on the right.","ko":"그러니까 규칙도 마침표와 같아요. 왼쪽에도 완전한 문장, 오른쪽에도 완전한 문장이 있어야 해요.","zh":"所以规则和句号一样：左边必须是完整句子，右边也必须是完整句子。","a":["in:#s-l","in:#s-r"]},{"en":"Here is a quick check. Replace the semicolon with a period. If both parts still work as sentences, the semicolon is correct.","ko":"빠르게 확인하는 방법이 있어요. 세미콜론 자리에 마침표를 넣어 보세요. 두 부분이 여전히 문장으로 성립하면 세미콜론이 맞아요.","zh":"有个快速检查方法：把分号换成句号。如果两部分仍然都是句子，分号就是对的。","a":["in:#s-t"]},{"en":"So a semicolon and a period are interchangeable on the SAT. If both appear in the choices for the same spot, neither can be the answer.","ko":"그래서 SAT에서 세미콜론과 마침표는 서로 바꿔 쓸 수 있어요. 같은 자리 선택지에 둘 다 있으면 둘 다 정답이 될 수 없어요.","zh":"所以在SAT中分号和句号可以互换。如果同一位置的选项里两者都出现，那两个都不是答案。"}]},
{"id":"semiwrong","ch":{"en":"Semicolon traps","ko":"세미콜론 함정","zh":"分号陷阱"},"html":"\n <div class=\"kick\">Trap</div><h2 class=\"h2\">⚠️ ; + not complete</h2>\n <div class=\"big card h\" id=\"w1\" style=\"font-size:2.6cqw\">Because the library closed at noon<span class=\"tok bad\">;</span> the staff went home early. <span class=\"stamp no\">✗</span></div>\n <div class=\"big card h\" id=\"w2\" style=\"font-size:2.6cqw\">The staff went home early<span class=\"tok bad\">;</span> because the library closed. <span class=\"stamp no\">✗</span></div>\n <div class=\"big card h\" id=\"w3\" style=\"font-size:2.6cqw\">Because the library closed at noon<span class=\"tok good\">,</span> the staff went home early. <span class=\"stamp ok\">✓</span></div>","b":[{"en":"Now the trap. 'Because the library closed at noon; the staff went home early.' Do the swap test.","ko":"이제 함정이에요. 'Because the library closed at noon; the staff went home early.' 바꿔 보기를 해 보세요.","zh":"现在看陷阱。Because the library closed at noon; the staff went home early. 做一下替换测试。","a":["in:#w1"]},{"en":"The left side starts with 'because,' so it cannot stand alone. A semicolon is wrong here.","ko":"왼쪽이 because로 시작해서 혼자 설 수 없어요. 그래서 세미콜론은 틀려요.","zh":"左边以 because 开头，不能独立成句。所以这里用分号是错的。"},{"en":"The same problem happens on the right: 'The staff went home early; because the library closed.' The right side is not complete.","ko":"오른쪽도 마찬가지예요. 'The staff went home early; because the library closed.' 오른쪽이 완전하지 않아요.","zh":"右边也会出现同样的问题：The staff went home early; because the library closed. 右边不完整。","a":["in:#w2"]},{"en":"When a dependent clause comes first, use a comma: 'Because the library closed at noon, the staff went home early.'","ko":"종속절이 앞에 오면 쉼표를 써요. 'Because the library closed at noon, the staff went home early.'","zh":"从句在前时用逗号：Because the library closed at noon, the staff went home early.","a":["in:#w3"]},{"q":{"en":{"q":"Which sentence uses the semicolon correctly?","o":["The trail was steep; but we reached the top.","The trail was steep; we reached the top anyway.","Although the trail was steep; we reached the top."],"e":"Both sides of B are complete sentences. In A, the right side starts with “but,” which needs a comma instead. In C, the left side is dependent."},"ko":{"q":"세미콜론을 올바르게 쓴 문장은?","o":["The trail was steep; but we reached the top.","The trail was steep; we reached the top anyway.","Although the trail was steep; we reached the top."],"e":"B는 양쪽 모두 완전한 문장이에요. A는 but과 함께라면 쉼표를 써야 하고, C는 왼쪽이 종속절이에요."},"zh":{"q":"哪个句子的分号用得正确？","o":["The trail was steep; but we reached the top.","The trail was steep; we reached the top anyway.","Although the trail was steep; we reached the top."],"e":"B 两边都是完整句子。A 用 but 时应该用逗号，C 的左边是从句。"},"a":1}}]},
{"id":"colon","ch":{"en":"Colon","ko":"콜론","zh":"冒号"},"html":"\n <div class=\"kick\">Step 2</div><h2 class=\"h2\" data-l=\"colon\"></h2>\n <div class=\"card h\" id=\"c0\" style=\"font-size:2.4cqw\"><b data-l=\"arrow\"></b></div>\n <div class=\"big card\" style=\"font-size:2.6cqw\"><span class=\"tok\" id=\"c-l\">The recipe needs three things</span><span class=\"tok good\">:</span> <span class=\"tok\" id=\"c-r\">flour, eggs, and milk.</span></div>\n <div class=\"row\"><span class=\"lbl g h\" id=\"c1\" data-l=\"leftc\"></span><span class=\"lbl s h\" id=\"c2\" data-l=\"any\"></span></div>\n <div class=\"pass card h\" id=\"c3\">She had one goal<b style=\"color:var(--ok)\">:</b> to win. ✓ &nbsp;&nbsp; He knew the answer<b style=\"color:var(--ok)\">:</b> the bridge was unsafe. ✓</div>","b":[{"en":"Next, the colon. A colon means: here is what I mean. What comes after it explains or lists what came before.","ko":"다음은 콜론이에요. 콜론은 '무슨 뜻이냐면'이라는 신호예요. 뒤에 오는 말이 앞의 내용을 설명하거나 나열해요.","zh":"接下来是冒号。冒号的意思是：我的意思是。后面的内容解释或列举前面的内容。","a":["in:#c0"]},{"en":"The rule: the left side must be a complete sentence. 'The recipe needs three things' is complete.","ko":"규칙은 이거예요. 왼쪽이 완전한 문장이어야 해요. 'The recipe needs three things'는 완전해요.","zh":"规则是：左边必须是完整句子。The recipe needs three things 是完整的。","a":["add:#c-l:subj","in:#c1"]},{"en":"The right side can be almost anything, as long as it explains the left: a list, a single word, a phrase, or another sentence.","ko":"오른쪽은 왼쪽을 설명하기만 하면 거의 뭐든 괜찮아요. 목록, 단어 하나, 구, 또는 또 하나의 문장도 돼요.","zh":"右边几乎可以是任何形式，只要它解释左边：一个列表、一个词、一个短语，或者另一个句子。","a":["add:#c-r:dep","in:#c2"]},{"en":"'She had one goal: to win.' 'He knew the answer: the bridge was unsafe.' Both are correct.","ko":"'She had one goal: to win.' 'He knew the answer: the bridge was unsafe.' 둘 다 맞아요.","zh":"She had one goal: to win. He knew the answer: the bridge was unsafe. 两句都对。","a":["in:#c3"]}]},
{"id":"colonwrong","ch":{"en":"Colon traps","ko":"콜론 함정","zh":"冒号陷阱"},"html":"\n <div class=\"kick\">Trap</div><h2 class=\"h2\">⚠️ The left side must be complete</h2>\n <div class=\"big card h\" id=\"k1\" style=\"font-size:2.6cqw\">The recipe needs<span class=\"tok bad\">:</span> flour, eggs, and milk. <span class=\"stamp no\">✗</span></div>\n <div class=\"big card h\" id=\"k2\" style=\"font-size:2.6cqw\">Bring supplies such as<span class=\"tok bad\">:</span> a map and a flashlight. <span class=\"stamp no\">✗</span></div>\n <div class=\"big card h\" id=\"k3\" style=\"font-size:2.6cqw\">The recipe needs flour, eggs, and milk. <span class=\"stamp ok\">✓</span></div>","b":[{"en":"Here is the most common colon mistake. 'The recipe needs: flour, eggs, and milk.'","ko":"가장 흔한 콜론 실수예요. 'The recipe needs: flour, eggs, and milk.'","zh":"这是最常见的冒号错误：The recipe needs: flour, eggs, and milk.","a":["in:#k1"]},{"en":"'The recipe needs' is not complete. Needs what? The verb is cut off from its object, so the colon is wrong.","ko":"'The recipe needs'는 완전하지 않아요. 뭘 필요로 하죠? 동사와 목적어 사이가 끊겼으니 콜론은 틀려요.","zh":"The recipe needs 不完整。需要什么？动词和宾语被切断了，所以冒号是错的。"},{"en":"The same goes for 'such as,' 'including,' and 'for example.' A colon right after them is wrong.","ko":"such as, including, for example 뒤도 마찬가지예요. 이 말들 바로 뒤에 콜론을 찍으면 틀려요.","zh":"such as、including、for example 后面也一样。紧跟在它们后面加冒号是错的。","a":["in:#k2"]},{"en":"The fix is often no punctuation at all: 'The recipe needs flour, eggs, and milk.'","ko":"고치는 방법은 대부분 아무 부호도 안 쓰는 거예요. 'The recipe needs flour, eggs, and milk.'","zh":"改法通常是什么标点都不加：The recipe needs flour, eggs, and milk.","a":["in:#k3"]},{"q":{"en":{"q":"Which sentence uses the colon correctly?","o":["The museum displays: paintings, maps, and coins.","The museum displays three kinds of objects: paintings, maps, and coins.","The museum displays objects such as: paintings and maps."],"e":"Only B has a complete sentence before the colon. In A and C, the colon cuts the sentence in the middle."},"ko":{"q":"콜론을 올바르게 쓴 문장은?","o":["The museum displays: paintings, maps, and coins.","The museum displays three kinds of objects: paintings, maps, and coins.","The museum displays objects such as: paintings and maps."],"e":"콜론 앞이 완전한 문장인 건 B뿐이에요. A와 C는 콜론이 문장을 중간에서 끊어요."},"zh":{"q":"哪个句子的冒号用得正确？","o":["The museum displays: paintings, maps, and coins.","The museum displays three kinds of objects: paintings, maps, and coins.","The museum displays objects such as: paintings and maps."],"e":"只有 B 冒号前是完整句子。A 和 C 的冒号把句子从中间切断了。"},"a":1}}]},
{"id":"dash","tight":1,"ch":{"en":"Dash","ko":"대시","zh":"破折号"},"html":"\n <div class=\"kick\">Step 3</div><h2 class=\"h2\" data-l=\"dash\"></h2>\n <div class=\"card h\" id=\"d1\"><b class=\"small\" data-l=\"single\"></b><div class=\"pass\" style=\"font-size:2.4cqw\">The recipe needs three things <b style=\"color:var(--ok)\">—</b> flour, eggs, and milk.</div></div>\n <div class=\"card h\" id=\"d2\"><b class=\"small\" data-l=\"pair\"></b><div class=\"pass\" style=\"font-size:2.4cqw\">The bridge <b style=\"color:var(--ok)\">—</b> <span class=\"hl\">the longest in the region</span> <b style=\"color:var(--ok)\">—</b> opened in 1937.</div></div>\n <div class=\"card h\" id=\"d3\"><div class=\"pass\" style=\"font-size:2.4cqw\">The bridge <b style=\"color:var(--bad)\">—</b> the longest in the region<b style=\"color:var(--bad)\">,</b> opened in 1937. ✗</div></div>","b":[{"en":"Now the dash. A single dash works almost like a colon. It introduces an explanation, so the left side should be complete.","ko":"이제 대시예요. 대시 하나는 콜론과 거의 비슷하게 써요. 설명을 이끌어 내니까 왼쪽이 완전해야 해요.","zh":"现在看破折号。单个破折号的用法几乎和冒号一样。它引出解释，所以左边应该完整。","a":["in:#d1"]},{"en":"But dashes often come in pairs. A pair of dashes puts extra information in the middle of a sentence, like brackets.","ko":"그런데 대시는 두 개가 짝으로 자주 나와요. 대시 한 쌍은 괄호처럼 문장 중간에 추가 정보를 넣어요.","zh":"但破折号常常成对出现。一对破折号像括号一样，把补充信息放在句子中间。","a":["in:#d2"]},{"en":"The rule for pairs: open with a dash, close with a dash. You cannot open with a dash and close with a comma.","ko":"짝 규칙은 이거예요. 대시로 열었으면 대시로 닫아요. 대시로 열고 쉼표로 닫으면 안 돼요.","zh":"成对的规则：用破折号开始，就用破折号结束。不能用破折号开始、用逗号结束。","a":["in:#d3"]},{"en":"Quick tip: on the SAT, look for a dash earlier in the sentence. If there is one, the answer often needs the matching dash.","ko":"팁 하나. SAT에서는 문장 앞쪽에 대시가 있는지 보세요. 있으면 정답은 짝이 되는 대시인 경우가 많아요.","zh":"小技巧：在SAT中先看句子前面有没有破折号。如果有，答案往往需要与之成对的破折号。"}]},
{"id":"lists","ch":{"en":"Semicolons in lists","ko":"목록 속 세미콜론","zh":"列表中的分号"},"html":"\n <div class=\"kick\">Step 4</div><h2 class=\"h2\" data-l=\"lists\"></h2>\n <div class=\"pass card\" style=\"font-size:2.3cqw\">The tour visits Lyon, France<span class=\"tok\" id=\"l1\">;</span> Turin, Italy<span class=\"tok\" id=\"l2\">;</span> and Geneva, Switzerland.</div>\n <div class=\"pass card h\" id=\"l3\" style=\"font-size:2.3cqw\">The tour visits Lyon, France, Turin, Italy, and Geneva, Switzerland. <span class=\"stamp no\">✗ ?</span></div>","b":[{"en":"There is one more job for the semicolon: separating items in a list when the items already contain commas.","ko":"세미콜론에는 역할이 하나 더 있어요. 항목 안에 이미 쉼표가 있는 목록에서 항목끼리 구분하는 거예요.","zh":"分号还有一个作用：当列表项目内部已经有逗号时，用分号把项目隔开。","a":["add:#l1:good","add:#l2:good"]},{"en":"'Lyon, France; Turin, Italy; and Geneva, Switzerland.' Each item is a city and a country with a comma inside.","ko":"'Lyon, France; Turin, Italy; and Geneva, Switzerland.' 각 항목이 도시와 나라라서 안에 쉼표가 있어요.","zh":"Lyon, France; Turin, Italy; and Geneva, Switzerland. 每一项都是城市加国家，内部有逗号。"},{"en":"With commas only, the reader cannot tell where one item ends. So the semicolon marks the bigger break.","ko":"쉼표만 쓰면 한 항목이 어디서 끝나는지 알 수 없어요. 그래서 더 큰 구분을 세미콜론으로 표시해요.","zh":"如果只用逗号，读者分不清一项在哪里结束。所以用分号标出更大的分隔。","a":["in:#l3"]},{"en":"On the SAT, keep the pattern consistent. If one item is followed by a semicolon, the others should be too.","ko":"SAT에서는 패턴을 일정하게 유지하세요. 한 항목 뒤에 세미콜론이 있으면 다른 항목 뒤에도 세미콜론이에요.","zh":"在SAT中保持一致。如果一个项目后用了分号，其他项目后也要用分号。"}]},
{"id":"table","ch":{"en":"Quick table","ko":"한눈에 보기","zh":"一览表"},"html":"\n <div class=\"kick\" data-l=\"cheat\"></div><h2 class=\"h2\">; &nbsp; : &nbsp; —</h2>\n <table class=\"tbl\" style=\"width:100%\"><tr><th></th><th data-l=\"left\"></th><th data-l=\"right2\"></th></tr>\n <tr id=\"t1\" class=\"h\"><td><b>. &nbsp;;</b></td><td>✓ complete</td><td>✓ complete</td></tr>\n <tr id=\"t2\" class=\"h\"><td><b>, + FANBOYS</b></td><td>✓ complete</td><td>✓ complete</td></tr>\n <tr id=\"t3\" class=\"h\"><td><b>: &nbsp;—</b></td><td>✓ complete</td><td>anything that explains</td></tr>\n <tr id=\"t4\" class=\"h\"><td><b>— … —</b></td><td colspan=\"2\">same mark on both sides</td></tr></table>","b":[{"en":"Let's put it all in one table. Period and semicolon: complete on both sides.","ko":"한 표로 정리해 볼게요. 마침표와 세미콜론은 양쪽 모두 완전해야 해요.","zh":"我们把内容整理成一张表。句号和分号：两边都要完整。","a":["in:#t1"]},{"en":"Comma plus FANBOYS: also complete on both sides.","ko":"쉼표 더하기 FANBOYS도 양쪽 모두 완전해야 해요.","zh":"逗号加FANBOYS：两边也都要完整。","a":["in:#t2"]},{"en":"Colon and single dash: the left side must be complete. The right side just has to explain it.","ko":"콜론과 대시 하나는 왼쪽만 완전하면 돼요. 오른쪽은 설명이기만 하면 돼요.","zh":"冒号和单个破折号：左边必须完整，右边只要是解释就行。","a":["in:#t3"]},{"en":"And paired dashes: whatever mark opens the extra information must also close it.","ko":"그리고 대시 한 쌍은 추가 정보를 연 부호와 같은 부호로 닫아야 해요.","zh":"成对的破折号：用什么符号开启补充信息，就用什么符号结束。","a":["in:#t4"]}]},
{"id":"example","ch":{"en":"Solve together","ko":"같이 풀기","zh":"一起做题"},"html":"\n <div class=\"kick\">SAT-style example</div>\n <div class=\"pass card\" style=\"font-size:2.3cqw\">Marine biologist Rachel Okafor studies one feature of octopuses more than any other <b>______</b> their ability to change color in less than a second.</div>\n <div class=\"choices\"><div id=\"x1\">A) other;</div><div id=\"x2\">B) other:</div><div id=\"x3\">C) other, and</div><div id=\"x4\">D) other, it is</div></div>\n <div class=\"side\"><div class=\"card h\" id=\"xl\"><b data-l=\"left\"></b> → ✓ complete</div><div class=\"card h\" id=\"xr\"><b data-l=\"right2\"></b> → ✗ not a sentence (explains “one feature”)</div></div>","b":[{"en":"Let's solve one together. Draw the line at the blank.","ko":"같이 한 문제 풀어 봐요. 빈칸에 세로줄을 그어요.","zh":"我们一起做一道题。在空格处画竖线。"},{"en":"The left side, 'Rachel Okafor studies one feature of octopuses more than any other,' is complete.","ko":"왼쪽 'Rachel Okafor studies one feature of octopuses more than any other'는 완전해요.","zh":"左边 Rachel Okafor studies one feature of octopuses more than any other 是完整的。","a":["in:#xl"]},{"en":"The right side, 'their ability to change color in less than a second,' has no tensed verb. It is not a sentence. It explains 'one feature.'","ko":"오른쪽 'their ability to change color in less than a second'에는 시제 있는 동사가 없어요. 문장이 아니에요. 'one feature'가 뭔지 설명하는 말이에요.","zh":"右边 their ability to change color in less than a second 没有时态动词，不是句子。它在解释 one feature。","a":["in:#xr"]},{"en":"Complete left side, explanation on the right: that is the colon. A needs two complete sentences. C joins a sentence to a fragment. D is a comma splice: 'it is their ability' is a complete sentence. The answer is B.","ko":"왼쪽은 완전하고 오른쪽은 설명이에요. 바로 콜론 자리예요. A는 양쪽이 완전해야 하고, C는 문장과 조각을 이어요. D는 'it is their ability'가 완전한 문장이라 comma splice예요. 정답은 B예요.","zh":"左边完整，右边是解释：这正是冒号的用法。A 需要两个完整句子，C 把句子和片段连起来，D 的 it is their ability 是完整句子，所以是逗号粘连。答案是 B。","a":["add:#x1:x","add:#x3:x","add:#x4:x","add:#x2:o"]},{"q":{"en":{"q":"“The festival — held every spring since 1952 ___ draws thousands of visitors.” Which is correct?","o":["1952,","1952 —","1952;"],"e":"The extra information opened with a dash, so it must close with a dash."},"ko":{"q":"“The festival — held every spring since 1952 ___ draws thousands of visitors.” 올바른 것은?","o":["1952,","1952 —","1952;"],"e":"추가 정보를 대시로 열었으니 대시로 닫아야 해요."},"zh":{"q":"“The festival — held every spring since 1952 ___ draws thousands of visitors.” 哪个正确？","o":["1952,","1952 —","1952;"],"e":"补充信息用破折号开启，就必须用破折号结束。"},"a":1}}]},
{"id":"summary","ch":{"en":"Summary","ko":"정리","zh":"总结"},"html":"\n <div class=\"kick\" data-l=\"sum\"></div><h2 class=\"h2\">📌 Lesson 2</h2>\n <ul class=\"sum card\"><li class=\"h\" id=\"s1\"><b>;</b> = soft period → ✓ ; ✓ (swap test with .)</li>\n <li class=\"h\" id=\"s2\"><b>:</b> → left side ✓ complete; no colon after <i>needs, such as, including</i></li>\n <li class=\"h\" id=\"s3\"><b>—</b> alone ≈ colon; <b>— … —</b> must match</li>\n <li class=\"h\" id=\"s4\">Items with commas inside → <b>;</b> between items</li></ul>","b":[{"en":"Let's review. A semicolon is a soft period, so both sides must be complete. Use the swap test.","ko":"정리할게요. 세미콜론은 부드러운 마침표라서 양쪽 모두 완전해야 해요. 바꿔 보기를 쓰세요.","zh":"我们来总结。分号是柔和的句号，两边都必须完整。用替换测试。","a":["in:#s1"]},{"en":"A colon needs a complete sentence on the left. Never put a colon right after a verb or after such as.","ko":"콜론은 왼쪽에 완전한 문장이 있어야 해요. 동사나 such as 바로 뒤에는 절대 콜론을 찍지 마세요.","zh":"冒号左边需要完整句子。绝不要在动词或 such as 后面直接加冒号。","a":["in:#s2"]},{"en":"A single dash works like a colon, and paired dashes must match.","ko":"대시 하나는 콜론처럼 쓰고, 대시 한 쌍은 짝이 맞아야 해요.","zh":"单个破折号像冒号一样用，成对的破折号必须匹配。","a":["in:#s3"]},{"en":"And when list items have commas inside, separate them with semicolons. Next time, we will learn about extra information in the middle of a sentence. See you in Lesson 3!","ko":"그리고 목록 항목 안에 쉼표가 있으면 항목 사이는 세미콜론으로 구분해요. 다음 시간에는 문장 중간에 들어가는 추가 정보를 배워요. 3강에서 만나요!","zh":"列表项目内有逗号时，项目之间用分号隔开。下节课我们学习句子中间的补充信息。第3课见！","a":["in:#s4"]}]}];

/* ===== Player engine ===== */
const $=s=>document.querySelector(s);
let LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q;const s=JSON.parse(localStorage.getItem('rwlab_v1')||'{}');return s.lang||'en'}catch(e){return 'en'}})();
if(!UI[LANG])LANG='en';
const FLAT=[];SC.forEach((s,si)=>s.b.forEach((b,bi)=>FLAT.push({si,bi,b})));
let pos=0,playing=false,timer=null,speed=1,cc=true,done=new Set(),utter=null,token=0;
function t(k){return (UI[LANG]||UI.en)[k]||UI.en[k]||k}
function buildScenes(){$('#scenes').innerHTML=SC.map((s,i)=>`<section class="scene${s.tight?' tight':''}" id="sc${i}">${s.html}</section>`).join('');document.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l))}
function applyStatic(){document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;$('#ttl').textContent=t('title');document.title=t('title');$('#note').textContent=t('note');$('#lang').value=LANG;
  $('#endh').textContent=t('endh');$('#endp').textContent=t('endp');$('#endgo').textContent=META.k==='GEN'?t('go0'):t('go');$('#endre').textContent=t('re');
  document.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l));chapters();bar();setPlay()}
function chapters(){$('#chap').innerHTML=SC.map((s,i)=>`<button data-c="${i}" class="${FLAT[pos]&&FLAT[pos].si===i?'on':''} ${done.has(i)?'done':''}">${i+1}. ${s.ch[LANG]||s.ch.en}</button>`).join('')}
function bar(){const segs=SC.map((s,i)=>{const idx=FLAT.map((f,k)=>f.si===i?k:-1).filter(k=>k>=0);const a=idx[0],z=idx[idx.length-1];const p=pos<a?0:pos>z?100:Math.round((pos-a+ (playing?0.5:0))/(z-a+1)*100);return`<i data-c="${i}"><b style="width:${p}%"></b></i>`});$('#bar').innerHTML=segs.join('');
  const tot=FLAT.length;$('#time').textContent=`${Math.min(pos+1,tot)} / ${tot}`}
function setPlay(){$('#play').textContent=playing?t('pause'):t('play')}
function resetScene(si){const el=$('#sc'+si);el.innerHTML=SC[si].html;el.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l))}
function act(a){const[k,sel,v]=a.split(':');const el=document.querySelector(sel);if(!el)return;if(k==='in')el.classList.add('in');if(k==='add')el.classList.add(v);if(k==='text')el.textContent=v}
function show(p,replay){const f=FLAT[p];if(!f)return;document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('on',i===f.si));
  if(replay){resetScene(f.si);FLAT.forEach((g,k)=>{if(g.si===f.si&&k<p&&g.b.a)g.b.a.forEach(act)})}
  if(f.b.a)f.b.a.forEach(act);chapters();bar()}
function txt(b){return b[LANG]||b.en}
function stopSpeech(){token++;clearTimeout(timer);stopAud();try{speechSynthesis.cancel()}catch(e){}}
let MAN=null,AUD=null,PK=null,PT=0;const LID=META.id;
function loadMan(){MAN=null;if(PK){PK.pause();PK=null}const L0=LANG;fetch(`../audio/${LID}.${LANG}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(m=>{if(!m||m.lang!==LANG)return;
  if(!m.pack){MAN=m;return}
  // one file per lesson+language: download it whole so seeking works on any host
  fetch('../audio/'+m.pack).then(r=>r.ok?r.blob():null).then(b=>{if(!b||LANG!==L0)return;PK=new Audio(URL.createObjectURL(b));PK.preload='auto';MAN=m}).catch(()=>{})}).catch(()=>{})}
function stopAud(){clearTimeout(PT);if(PK){PK.onplaying=null;PK.pause()}if(AUD){AUD.onended=null;AUD.pause();AUD=null}}
function speak(text,cb,idx){const my=++token;let fired=false;const fin=()=>{if(fired||my!==token)return;fired=true;cb()};
  const rec=MAN&&idx!=null&&MAN.beats[idx];
  if(rec&&MAN.pack&&PK){stopAud();const P=PK;P.playbackRate=speed;
    // one file per lesson+language: seek to this sentence, stop when its time is up
    P.onplaying=()=>{P.onplaying=null;clearTimeout(PT);PT=setTimeout(()=>{if(PK===P)P.pause();fin()},rec.dur*1000/P.playbackRate)};
    try{P.currentTime=rec.start}catch(e){}P.play().catch(()=>{timer=setTimeout(fin,rec.dur*1000/speed)});timer=setTimeout(fin,(rec.dur/speed+5)*1000);return}
  if(rec){stopAud();AUD=new Audio('../audio/'+rec.file);AUD.playbackRate=speed;AUD.onended=fin;AUD.onerror=()=>{AUD=null;timer=setTimeout(fin,Math.max(2200,text.length/14*1000))};AUD.play().catch(()=>{timer=setTimeout(fin,(rec.dur||3)*1000/speed)});timer=setTimeout(fin,((rec.dur||3)/speed+4)*1000);return}
  const cps={en:14,ko:7,zh:5}[LANG]*speed;const est=Math.max(2200,text.length/cps*1000)+500;
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(text);const lc={en:'en-US',ko:'ko-KR',zh:'zh-CN'}[LANG];u.lang=lc;u.rate=speed*(LANG==='en'?0.98:1);
    const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang&&x.lang.replace('_','-').toLowerCase()===lc.toLowerCase())||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lc.slice(0,2)));
    if(v){u.voice=v;u.onend=fin;u.onerror=()=>{timer=setTimeout(fin,est)};speechSynthesis.speak(u);timer=setTimeout(fin,est*2.2);return}}}catch(e){}
  timer=setTimeout(fin,est)}
function step(){const f=FLAT[pos];if(!f){finish();return}
  if(f.b.q){showQuiz(f.b.q);return}
  $('#subt').textContent=txt(f.b);speak(txt(f.b),()=>{if(!playing)return;pos++;if(FLAT[pos]&&FLAT[pos].si!==f.si)done.add(f.si);if(pos>=FLAT.length){done.add(f.si);finish();return}show(pos);step()},pos)}
function play(){if(pos>=FLAT.length){pos=0;show(0,true)}playing=true;setPlay();$('#end').classList.remove('on');show(pos);step()}
function pause(){playing=false;stopSpeech();setPlay();bar()}
function jump(p){stopSpeech();$('#quiz').classList.remove('on');pos=Math.max(0,Math.min(FLAT.length-1,p));show(pos,true);if(playing)step();else{$('#subt').textContent=FLAT[pos].b.q?'':txt(FLAT[pos].b)}}
function sceneStart(i){return FLAT.findIndex(f=>f.si===i)}
function showQuiz(q){stopSpeech();const d=q[LANG]||q.en;$('#qk').textContent=t('check');$('#qq').textContent=d.q;$('#qfb').textContent='';$('#qgo').style.display='none';$('#qgo').textContent=t('cont');
  $('#qo').innerHTML=d.o.map((o,i)=>`<button class="o" data-i="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('');$('#quiz').classList.add('on');$('#subt').textContent='';
  const say=d.q;speak(say,()=>{},pos);
  $('#qo').onclick=e=>{const b=e.target.closest('button.o');if(!b)return;const i=+b.dataset.i;if(i===q.a){b.classList.add('right');$('#qfb').innerHTML=`<b style="color:var(--ok)">${t('right')}</b> ${d.e}`;$('#qgo').style.display='inline-block';$('#qo').onclick=null;speak(t('right'),()=>{})}else{b.classList.add('wrong');$('#qfb').innerHTML=`<b style="color:var(--bad)">${t('wrong')}</b>`;setTimeout(()=>b.classList.remove('wrong'),400)}}}
$('#qgo').onclick=()=>{$('#quiz').classList.remove('on');pos++;if(pos>=FLAT.length){finish();return}show(pos);if(playing)step();else play()};
function finish(){playing=false;stopSpeech();setPlay();SC.forEach((s,i)=>done.add(i));chapters();bar();$('#end').classList.add('on');$('#subt').textContent='';try{parent.postMessage({type:'lessonDone',id:META.id},'*')}catch(e){}}
$('#endgo').onclick=()=>{try{if(parent!==window){parent.postMessage({type:'lessonPractice',k:META.k},'*');return}}catch(e){}location.href='../index.html#train'};
$('#endre').onclick=()=>{done.clear();pos=0;$('#end').classList.remove('on');show(0,true);play()};
$('#play').onclick=()=>playing?pause():play();
$('#next').onclick=()=>{const si=FLAT[pos].si;const n=sceneStart(si+1);if(n>=0)jump(n)};
$('#prev').onclick=()=>{const si=FLAT[pos].si,st=sceneStart(si);jump(pos>st?st:sceneStart(Math.max(0,si-1)))};
$('#chap').onclick=e=>{const b=e.target.closest('button');if(b)jump(sceneStart(+b.dataset.c))};
$('#bar').onclick=e=>{const i=e.target.closest('i');if(i)jump(sceneStart(+i.dataset.c))};
$('#lang').onchange=e=>{LANG=e.target.value;try{const s=JSON.parse(localStorage.getItem('rwlab_v1')||'{}');s.lang=LANG;localStorage.setItem('rwlab_v1',JSON.stringify(s))}catch(x){}const was=playing;stopSpeech();loadMan();buildScenes();applyStatic();show(pos,true);if(was)step();else $('#subt').textContent=FLAT[pos].b.q?'':txt(FLAT[pos].b)};
$('#spd').onchange=e=>{speed=+e.target.value;if(AUD)AUD.playbackRate=speed;if(playing){stopSpeech();step()}};
$('#cc').onclick=()=>{cc=!cc;$('#sub').classList.toggle('off',!cc);$('#cc').setAttribute('aria-pressed',cc)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
if(parent!==window)document.body.classList.add('embed');loadMan();buildScenes();applyStatic();show(0);$('#subt').textContent=txt(FLAT[0].b);
</script>
</body>
